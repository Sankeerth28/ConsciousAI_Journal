name: CI/CD Pipeline

on:
  push:
    branches: [main, v2-dev]
  pull_request:
    branches: [main, v2-dev]

permissions:
  contents: read

jobs:
  lint-and-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv sync --extra dev

      - name: Ruff Lint Check
        run: |
          uv run ruff check .

      - name: Ruff Format Check
        run: |
          uv run ruff format --check .

      - name: Verify Import Safety
        run: |
          uv run python scripts/check_import_safety.py

      - name: Verify Alembic Migration Status
        run: |
          uv run alembic current

  test-suite:
    name: Automated Tests
    runs-on: ubuntu-latest
    needs: lint-and-quality
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv sync --extra dev

      - name: Run Pytest Suite with Coverage
        run: |
          uv run pytest --cov=app --cov-report=term-missing

  docker-build:
    name: Staging Docker Build & Validation
    runs-on: ubuntu-latest
    needs: lint-and-quality
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: consciousai-journal:ci-test
