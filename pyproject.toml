[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "consciousai-journal"
version = "2.0.0a1"
description = "AI-powered self-reflection journaling application"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.13"
authors = [
    {name = "Sankeerth Naidu"},
]
keywords = ["journaling", "ai", "self-reflection", "mental-health", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.115.0,<0.116",
    "uvicorn[standard]>=0.30.0,<0.35",
    "pydantic>=2.7.0,<3.0",
    "pydantic-settings>=2.3.0,<3.0",
    "sqlmodel>=0.0.22,<0.1",
    "alembic>=1.13.0,<2.0",
    "python-dotenv>=1.0.0,<2.0",
    "tzdata>=2024.1",
    "pyjwt>=2.8.0,<3.0",
    "bcrypt>=4.0.0,<5.0",
    "email-validator>=2.0.0",
    "redis>=5.0.0,<6.0",
    "psycopg2-binary>=2.9.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0",
    "pytest-cov>=5.0.0,<6.0",
    "httpx>=0.27.0,<1.0",
    "ruff>=0.5.0,<1.0",
]
ai = [
    "transformers>=4.40.0,<5.0",
    "sentence-transformers>=3.0.0,<4.0",
    "torch>=2.3.0",
    "faiss-cpu>=1.8.0,<2.0",
]

[project.urls]
Homepage = "https://github.com/Sankeerth28/ConsciousAI_Journal"
Repository = "https://github.com/Sankeerth28/ConsciousAI_Journal"
Documentation = "https://github.com/Sankeerth28/ConsciousAI_Journal/tree/main/docs"

# --- Tool Configuration ---

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "real_ai: optional smoke tests running real Hugging Face downloads and models (run only with RUN_REAL_HF_SMOKE_TESTS=1)",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["notebooks", "*.ipynb"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (standard for FastAPI Depends/Query)
]

[tool.ruff.lint.per-file-ignores]
"app/schemas/*" = ["TC001", "TC002", "TC003"]
"app/models/*" = ["TC001", "TC002", "TC003"]
"app/api/*" = ["TC001", "TC002", "TC003"]
"tests/*" = ["TC001", "TC002", "TC003"]
"alembic/*" = ["TC001", "TC002", "TC003"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
