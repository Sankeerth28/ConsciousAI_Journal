services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - APP_ENV=staging
      - DEBUG=false
      - POSTGRES_USER=${POSTGRES_USER:-consciousai}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-consciousai_dev_password}
      - POSTGRES_DB=${POSTGRES_DB:-consciousai_staging}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-consciousai}:${POSTGRES_PASSWORD:-consciousai_dev_password}@db:5432/${POSTGRES_DB:-consciousai_staging}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-154b1a4a7744635489b1467bbbbde95a}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-consciousai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-consciousai_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-consciousai_staging}
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-consciousai} -d ${POSTGRES_DB:-consciousai_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - staging_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6380:6379"

volumes:
  staging_pgdata:
  staging_redisdata:

